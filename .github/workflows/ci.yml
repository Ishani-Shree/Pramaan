name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pramaan
          POSTGRES_PASSWORD: pramaan
          POSTGRES_DB: pramaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pramaan -d pramaan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://pramaan:pramaan@localhost:5432/pramaan_test
      # Fail (don't skip) the DB tests if Postgres isn't reachable.
      PRAMAAN_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: "Install test dependencies (no PyTorch: tests use fakes)"
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -v
